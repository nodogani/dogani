<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>dogani Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light mode-nav">
  <div id="root">
    <!-- 네비게이션 바 (하나뿐): 공간 이름 ▾ · 할일 날짜 이동 · 할일/달력 버튼 -->
    <nav id="nav" title="드래그해서 이동">
      <button id="space-btn" class="space-btn" title="공간 고르기 (공용 / 개인)">
        <span id="status-dot" class="dot"></span>
        <span id="space-name"></span>
        <svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="btn-note" class="nav-btn" title="할일">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button id="btn-cal" class="nav-btn" title="달력">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </button>
    </nav>

    <!-- 공간 메뉴 (노션 사이드바처럼 공용 / 개인) -->
    <div id="space-menu" class="space-menu" hidden></div>

    <section id="panel" hidden>
      <!-- 할일 창 -->
      <div id="view-note" class="view" hidden>
        <div class="panel-bar" title="드래그해서 이동">
          <button class="icon-btn" id="note-prev" title="이전 근무일">&#x2039;</button>
          <div class="header-title" id="note-title"></div>
          <button class="icon-btn" id="note-next" title="다음 근무일">&#x203A;</button>
          <button class="text-btn" id="note-today">오늘</button>
          <button class="icon-btn close-btn" title="닫기">&#x2715;</button>
        </div>
        <div class="progress-row" id="note-progress">
          <div class="progress"><div class="progress-bar" id="note-bar"></div></div>
          <span class="progress-text" id="note-count"></span>
        </div>
        <div class="sched-row" id="note-sched" hidden></div>
        <article id="note-body" class="markdown-rendered"></article>
        <footer class="view-footer" id="note-footer"></footer>
      </div>

      <!-- 달력 창 -->
      <div id="view-cal" class="view" hidden>
        <div class="panel-bar" title="드래그해서 이동">
          <button class="icon-btn" id="cal-prev" title="이전 달">&#x2039;</button>
          <div class="header-title" id="cal-title"></div>
          <button class="icon-btn" id="cal-next" title="다음 달">&#x203A;</button>
          <button class="text-btn" id="cal-today">오늘</button>
          <button class="text-btn" id="cal-edit" title="일정 파일 편집">일정 편집</button>
          <button class="icon-btn close-btn" title="닫기">&#x2715;</button>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        <footer class="view-footer" id="cal-footer"></footer>
        <form id="ev-add" class="ev-add" hidden autocomplete="off">
          <div class="seg" id="ev-add-seg">
            <button type="button" data-kind="event" title="하는 일: 회의·실사·발표 등 (여러 날이면 띠로 표시)">일정</button>
            <button type="button" data-kind="span" title="이어지는 상태: 출장·교육·연차·마감까지 등 (화살표로 표시)">기간</button>
          </div>
          <input type="text" id="ev-add-name" class="ev-add-name" placeholder="제목" required>
          <div class="ev-add-opts">
            <label><input type="checkbox" id="ev-add-bold">중요</label>
            <label title="정확한 시각 모름, 그 사이 언젠가"><input type="checkbox" id="ev-add-about">애매함</label>
            <label><input type="checkbox" id="ev-add-off">쉬는 날</label>
          </div>
          <div class="ev-add-grid">
            <span class="k">날짜</span>
            <div class="v">
              <input type="date" id="ev-add-start"><span class="sep">-</span><input type="date" id="ev-add-end">
            </div>
            <span class="k">시간</span>
            <div class="v">
              <select id="ev-add-t1"></select><span class="sep">-</span><select id="ev-add-t2"></select>
            </div>
            <span class="k">태그</span>
            <div class="v"><input type="text" id="ev-add-tags" placeholder="쉼표로 구분  예) 과제, 교육"></div>
            <span class="k">장소</span>
            <div class="v"><input type="text" id="ev-add-place"></div>
            <span class="k" id="ev-add-memo-k" hidden>메모</span>
            <div class="v" id="ev-add-memo-row" hidden><input type="text" id="ev-add-memo"></div>
          </div>
          <div class="ev-add-hint" id="ev-add-hint"></div>
          <div class="ev-add-err" id="ev-add-err"></div>
          <div class="ev-add-btns">
            <button type="button" class="text-btn" id="ev-add-memo-btn">+ 메모</button>
            <button type="button" class="text-btn danger" id="ev-add-del" hidden>삭제</button>
            <span class="grow"></span>
            <button type="button" class="text-btn" id="ev-add-cancel">취소</button>
            <button type="submit" class="text-btn active" id="ev-add-ok">추가</button>
          </div>
        </form>
      </div>

      <!-- 달력 창 > 일정 편집 -->
      <div id="view-doc" class="view" hidden>
        <div class="panel-bar" title="드래그해서 이동">
          <button class="text-btn" id="doc-back">&#x2039; 달력</button>
          <div class="header-title" id="doc-title">일정</div>
          <button class="icon-btn close-btn" title="닫기">&#x2715;</button>
        </div>
        <div class="doc-hint">한 줄 = <code>날짜, 제목, #태그, 장소, 메모</code> · <b>**굵게**</b> 중요 · <mark>==하이라이트==</mark> 쉬는 날 · <i>*기울임*</i> 기간 화살표</div>
        <article id="doc-body" class="markdown-rendered"></article>
        <footer class="view-footer" id="doc-footer"></footer>
      </div>

      <div id="resize-grip" title="크기 조절"></div>
    </section>
  </div>

  <script src="vendor/editor.js"></script>
  <script src="markdown.js"></script>
  <script src="calendar.js"></script>
  <script src="app.js"></script>
</body>
</html>
